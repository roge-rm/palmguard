# PalmGuard config. The PalmGuard app edits this file. After editing by hand,
# run `su -c sh /data/adb/modules/palmguard/ctl.sh reload` (device names
# need `ctl.sh restart`).

# A contact whose first TOUCH_MAJOR is at or below this is the pen.
# Your pen measured 30-60; the lightest hand contact seen was 100.
pen_max_major = 80

# A pen contact that grows past this is treated as a hand and cancelled.
pen_regrade_major = 150

# Non-pen contacts starting within this many ms after the pen lifts are
# ignored (catches the hand shifting between strokes).
grace_ms = 500

# Non-pen contacts are held back this many ms before reaching apps, so a hand
# that lands just before the pen is never seen. Adds this much latency to
# finger touches while the pen is out.
holdoff_ms = 40

# Only filter while the pen is out of its silo. Docking the pen always gives
# you the stock touchscreen back.
require_pen_out = true

# Log every contact decision to palmguard.log.
verbose = false

touch_device = goodix_ts
pen_device = pen_detect
virtual_name = palmguard_ts
